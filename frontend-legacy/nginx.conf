server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls tới FastAPI backend
    # proxy_buffering off bắt buộc cho SSE streaming hoạt động đúng
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
