<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử nghiệm công thức DOCX</title>
<link rel="stylesheet" href="/static/katex/katex.min.css"><script src="/static/katex/katex.min.js"></script>
<style>body{font:16px system-ui;background:#f2f6f4;color:#17362a;margin:0}main{max-width:940px;margin:32px auto;padding:24px;background:white;border-radius:14px}input,textarea,select,button{padding:10px;margin:5px;border:1px solid #b5c6bb;border-radius:6px}button{background:#176b46;color:white;cursor:pointer}label{display:block;padding:7px}input[type=checkbox]{width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f2;padding:16px}#question{width:75%}.muted{color:#52665a}#message{padding:12px}h1{font-size:25px}</style>
<main><h1>Thử nghiệm tính công thức từ DOCX</h1><p id="mode" class="muted"></p><p>Đối chiếu công thức, đơn vị và điều kiện trước khi tính. Kết quả thử nghiệm chưa phải kết luận kiểm định.</p><input id="question" placeholder="Công thức sai số áp suất chỉnh đặt van an toàn là gì?"><button id="ask">Tra cứu</button><label for="document-filter">Tài liệu nguồn <select id="document-filter"><option value="">Tất cả tài liệu</option></select></label><p id="document-count" class="muted"></p><div id="examples"></div><div id="message" role="status"></div><section id="card" hidden><h2 id="title"></h2><p id="source"></p><div id="rendered-formula"></div><pre id="formula"></pre><details><summary>Trích đoạn tài liệu</summary><pre id="context"></pre></details><form id="fields"></form><button id="compute">Tính</button><button id="restore">Khôi phục dữ liệu nhập</button><pre id="result" aria-live="polite"></pre></section></main>
<script>
let current=null,epoch=0,conditions={};const $=id=>document.getElementById(id);
function invalidate(){epoch++;$('result').textContent='Dữ liệu đã thay đổi; cần tính lại.'}
function message(s){$('message').textContent=s}
async function json(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Dịch vụ chưa sẵn sàng');return d}
function fieldValue(){return Object.fromEntries(current.spec.variables.map(v=>[v.key,{value:v.kind==='series'?document.getElementById('v-'+v.key).value.split(/[;\n]/).map(x=>x.trim()):document.getElementById('v-'+v.key).value,unit:document.getElementById('u-'+v.key).value}]))}
function draw(d){current=d;$('card').hidden=false;$('title').textContent=d.spec.title;$('source').textContent=d.source.file+' — '+d.source.section+' — phiên bản '+d.spec.revision+(d.source.derivation_note?' — '+d.source.derivation_note:'');$('formula').textContent=d.source.formulas.map(f=>f.latex).join('\n')+'\nBiểu thức tính: '+d.spec.expression;$('context').textContent=d.source.context;$('rendered-formula').replaceChildren();for(const f of d.source.formulas){const el=document.createElement('div');$('rendered-formula').append(el);try{katex.render(f.latex.replace(/\\DeltaP/g,'\\Delta P'),el,{displayMode:true,throwOnError:true,trust:false})}catch(e){el.textContent=f.latex}}$('fields').replaceChildren();
for(const v of d.spec.variables){const label=document.createElement('label');label.textContent=v.label+' ('+v.key+') ';const input=document.createElement(v.kind==='series'?'textarea':'input');input.id='v-'+v.key;if(v.kind==='series'){input.rows=3;input.placeholder='Mỗi số một dòng hoặc ngăn bằng dấu ; — dùng dấu chấm thập phân';input.setAttribute('aria-description','Từ '+v.min_items+' đến '+v.max_items+' số, cùng đơn vị');}else{input.type='text';input.inputMode='decimal';}input.required=true;input.setAttribute('aria-label',v.label);const u=document.createElement('input');u.id='u-'+v.key;u.value=v.unit;u.setAttribute('aria-label','Đơn vị '+v.label);input.oninput=invalidate;u.oninput=invalidate;label.append(input,u);$('fields').append(label)}
for(const c of d.spec.conditions||[]){const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.id='c-'+c;input.onchange=invalidate;label.append(input,document.createTextNode(conditions[c]||c));$('fields').append(label)}$('result').textContent='';}
$('ask').onclick=async()=>{const n=++epoch;current=null;$('card').hidden=true;message('Đang tìm công thức…');try{const d=await json('/api/lab/prepare',{question:$('question').value});if(n!==epoch)return;if(d.status==='ready'){draw(d);message('Kiểm tra nguồn và nhập đầy đủ số liệu.')}else message(d.message||d.status)}catch(e){if(n===epoch)message(e.message)}};
$('compute').onclick=async()=>{if(!current)return;const n=++epoch;const inputs=fieldValue();const confirms=Object.fromEntries((current.spec.conditions||[]).map(c=>[c,$('c-'+c).checked]));localStorage.setItem('formula-lab-input',JSON.stringify({formula:current.spec.id,revision:current.spec.revision,source:current.source.docx_sha256,inputs}));$('result').textContent='Đang tính…';try{const d=await json('/api/lab/calculate',{session_id:current.session_id,revision:current.spec.revision,inputs,confirmations:confirms,request_id:String(n)});if(n!==epoch)return;$('result').textContent=d.status==='ok'?JSON.stringify(d,null,2):(d.message||d.status)}catch(e){if(n===epoch)$('result').textContent=e.message}};
$('restore').onclick=()=>{try{const x=JSON.parse(localStorage.getItem('formula-lab-input'));if(!x||x.formula!==current.spec.id||x.revision!==current.spec.revision||x.source!==current.source.docx_sha256)throw Error('Không có dữ liệu khớp phiên bản và nguồn.');for(const v of current.spec.variables){const stored=x.inputs[v.key]?.value;$('v-'+v.key).value=Array.isArray(stored)?stored.join('\n'):(stored||'');$('u-'+v.key).value=x.inputs[v.key]?.unit||v.unit}for(const c of current.spec.conditions||[])$('c-'+c).checked=false;invalidate();message('Đã khôi phục đầu vào; xác nhận lại điều kiện và tính lại.')}catch(e){message(e.message)}};
json('/api/lab/info').then(d=>{
$('mode').textContent='Hướng thử: '+d.strategy+' — '+d.examples.length+' bộ tính trên '+d.documents.length+' DOCX nguồn';conditions=d.conditions;
for(const doc of d.documents){const option=document.createElement('option');option.value=doc.file;option.textContent=doc.file+' ('+doc.examples.length+')';$('document-filter').append(option)}
function showExamples(){const selected=d.documents.find(doc=>doc.file===$('document-filter').value);const examples=selected?selected.examples:d.examples;$('examples').replaceChildren();$('document-count').textContent=examples.length+' bộ tính — gồm phương trình và quy tắc định lượng từ lời văn';for(const s of examples){const b=document.createElement('button');b.textContent=s;b.onclick=()=>{$('question').value='Công thức '+s+' là gì?';$('ask').click()};$('examples').append(b)}}
$('document-filter').onchange=showExamples;showExamples();
}).catch(e=>message(e.message));
</script></html>
