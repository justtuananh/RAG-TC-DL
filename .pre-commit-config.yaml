# Pre-commit cho harness QTKĐ.  Kích hoạt:  .venv-dev/bin/pre-commit install
#
# Ruff CHỈ chạy trên code harness (tests/, scripts/) — KHÔNG định dạng lại source
# hiện có (app.py, retrieval/, index/, ingestion/, eval/). Các hook chung loại trừ
# TC_DL/ và build/ vì repo cố tình track binary lớn ở đó.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(tests|scripts)/
      - id: ruff-format
        files: ^(tests|scripts)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(TC_DL/|build/|docs/|vendor/)
      - id: trailing-whitespace
        exclude: ^(TC_DL/|build/|docs/|vendor/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
        exclude: ^(TC_DL/|build/)
