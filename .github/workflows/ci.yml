name: CI

# Chỉ chạy TẦNG CLOUD-FEASIBLE của harness: lint + fidelity guard + unit test (mock).
#
# CỐ TÌNH KHÔNG chạy trên CI (cần tài nguyên không có trên runner cloud, dự án offline):
#   • integration / services  → cần Docker stack (Qdrant/Ollama) + model bge (GPU/tải nặng)
#   • eval (make eval)         → cần stack thật + 55 câu (chậm)
#   • ruby                     → cần Ruby + gem mathtype_to_mathml (_GEM_PATHS macOS 2.6)
#   • inference model thật     → GPU/offline (test server.py dùng model GIẢ nên vẫn chạy)
#
# Fidelity guard chạy được vì build/spike_a/ (report + *.md) đã được commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runtime lock matches Docker; test tools are separate from runtime.
      - name: Cài đặt phụ thuộc (cloud-feasible)
        run: pip install -r requirements-app.lock -r requirements-dev.txt && pip check

      # `make check PY=python` = đúng cổng chạy local → "xanh local ⇒ xanh CI".
      - name: Lint + fidelity + unit tests
        run: make check PY=python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run lint
      - run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only API/FE; no GPU models or real corpus are loaded here.
      - run: docker compose config --quiet
      - run: docker compose build api frontend
      - name: Check API image imports and formula routes
        run: >-
          docker run --rm qtkd-app:local python -c
          "from api_server import app; from formula_registry.store import Registry;
          assert '/api/formula-drafts/{id}/calculate' in app.openapi()['paths'];
          assert Registry().list('ci-empty-document') == []"
