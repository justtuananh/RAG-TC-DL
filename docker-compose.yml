# docker-compose.yml — QTKĐ RAG full stack
#
# ── Khởi động lần đầu ──────────────────────────────────────────────────────
#   make up            → build images + start tất cả services (~10-20 phút, tải models)
#   make pull-model    → tải LLM qwen2.5:1.5b vào Ollama (~940MB)
#   make index         → index build/spike_a/ vào Qdrant (chạy 1 lần)
#
# ── Sử dụng hằng ngày ──────────────────────────────────────────────────────
#   make up            → start (không rebuild)
#   make down          → dừng tất cả
#   make logs          → xem log realtime
#   make index         → re-index khi thêm tài liệu mới
#
# ── Ports ──────────────────────────────────────────────────────────────────
#   :3000  → React frontend  (http://localhost:3000)
#   :8080  → FastAPI backend (api_server.py, SSE)
#   :8010  → Embedding API   (BAAI/bge-m3)
#   :8011  → Reranker API    (BAAI/bge-reranker-v2-m3)
#   :6333  → Qdrant          (vector database)
#   :11434 → Ollama          (LLM: qwen2.5:1.5b)
#
# ── Lưu ý macOS ────────────────────────────────────────────────────────────
#   Docker trên Mac không dùng được Apple Silicon GPU.
#   Nếu muốn dùng GPU Metal: cài Ollama native (brew install ollama),
#   chạy `ollama serve`, rồi trong .env đặt:
#     OLLAMA_URL=http://host.docker.internal:11434/v1/chat/completions
#   Sau đó bỏ comment service `ollama` bên dưới.
#
# ── Lưu ý Linux + NVIDIA GPU ───────────────────────────────────────────────
#   Bỏ comment phần deploy.resources trong service `ollama` để dùng GPU.
#   Yêu cầu: nvidia-container-toolkit đã cài.

services:

  # ── PostgreSQL: Relational ledger (not exposed to host, internal only) ──────
  postgres:
    image: postgres:16-alpine
    container_name: qtkd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qtkd}
      POSTGRES_USER: ${POSTGRES_USER:-qtkd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtkd_password}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtkd_user}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Vector Database ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: qtkd-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Embedding service: BAAI/bge-m3 (1024-dim) ──────────────────────────────
  embedding:
    build:
      context: docker/inference
      dockerfile: Dockerfile
      args:
        MODE: embedding
        EMBEDDING_MODEL: BAAI/bge-m3
    image: qtkd-embedding:local
    container_name: qtkd-embedding
    environment:
      MODE: embedding
      EMBEDDING_MODEL: BAAI/bge-m3
      PORT: "8010"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      # Cache model bền vững qua các lần restart/recreate — tránh phải tải lại
      # từ huggingface.co mỗi lần container khởi động (nguyên nhân gây crash
      # khi mạng chập chờn). Sau khi cache đã có, có thể bật HF_HUB_OFFLINE=1.
      - hf_cache_embedding:/root/.cache/huggingface
    ports:
      - "8010:8010"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # ── Reranker service: BAAI/bge-reranker-v2-m3 ──────────────────────────────
  reranker:
    build:
      context: docker/inference
      dockerfile: Dockerfile
      args:
        MODE: reranker
        RERANKER_MODEL: BAAI/bge-reranker-v2-m3
    image: qtkd-reranker:local
    container_name: qtkd-reranker
    environment:
      MODE: reranker
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      # 512 cắt mất nội dung section dài trước khi cross-encoder kịp thấy
      # (đo được Q39/Q48 bị giáng hạng). retrieval đã tự cắt doc ≈1.5k ký tự
      # quanh child match nên 1024 là dư an toàn.
      RERANKER_MAX_LENGTH: "1024"
      PORT: "8011"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - hf_cache_reranker:/root/.cache/huggingface
    ports:
      - "8011:8011"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # ── LLM: Ollama (qwen2.5:1.5b dev / qwen2.5:7b prod) ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qtkd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      OLLAMA_HOST: "0.0.0.0"
      # Mặc định Ollama nạp model với ctx 4096 — NHỎ hơn num_ctx=8192 mà
      # generation.py yêu cầu; endpoint /v1 (OpenAI-compat) lại BỎ QUA trường
      # "options" nên prompt dài bị cắt từ ĐẦU (mất system prompt + nguồn [1][2]).
      # generation.py nay gọi /api/chat (options được tôn trọng); env này là
      # lưới an toàn cho mọi client /v1 khác.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Buộc offload tất cả layers lên GPU (tránh Ollama tự partial-offload khi
      # ước tính VRAM không đủ). qwen2.5:3b ~2GB fits trong ~3.5GB VRAM còn lại.
      OLLAMA_NUM_GPU: "999"
      # Giữ model trên GPU mãi mãi — embedding/reranker sẽ tự nhả VRAM sau idle,
      # nhường lại cho Ollama thay vì Ollama unload rồi reload lại.
      OLLAMA_KEEP_ALIVE: "-1"
    restart: unless-stopped
    # ── NVIDIA GPU: bỏ comment để dùng RTX 5060 ──────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── FastAPI Backend cho React frontend ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qtkd-app:local
    container_name: qtkd-api
    ports:
      - "8080:8080"
    volumes:
      # Writable (not :ro like the `app`/`indexer` services) — the upload
      # feature saves .docx here and writes extracted .md/assets/report here.
      - ./build/spike_a:/app/build/spike_a
      - ./TC_DL:/app/TC_DL
      - ./api_server.py:/app/api_server.py:ro
      - ./generation.py:/app/generation.py:ro
      - ./latex.py:/app/latex.py:ro
      - ./ingestion_jobs.py:/app/ingestion_jobs.py:ro
      - ./retrieval:/app/retrieval:ro
      - ./index:/app/index:ro
      - ./ingestion:/app/ingestion:ro
      - ./db:/app/db:ro
      - ./auth:/app/auth:ro
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini:ro
    environment:
      EMBED_URL: http://embedding:8010/v1/embeddings
      RERANK_URL: http://reranker:8011/v1/rerank
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-qtkd}
      POSTGRES_USER: ${POSTGRES_USER:-qtkd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtkd_password}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    command: ["uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend (nginx serve + proxy /api → api:8080) ────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: qtkd-frontend:local
    container_name: qtkd-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── One-time Indexer (chạy: make index) ────────────────────────────────────
  indexer:
    image: qtkd-app:local   # reuse image built by `api` service
    container_name: qtkd-indexer
    volumes:
      - ./build/spike_a:/app/build/spike_a:ro
      - ./index:/app/index:ro   # live-reload code without image rebuild
    environment:
      EMBED_URL: http://embedding:8010/v1/embeddings
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "index.embed_store"]

volumes:
  postgres_storage:   # PostgreSQL data persists across restarts
  qdrant_storage:   # Qdrant data persists across restarts
  ollama_data:      # Downloaded LLM models persist across restarts
  hf_cache_embedding:  # BAAI/bge-m3 weights persist across restarts
  hf_cache_reranker:   # BAAI/bge-reranker-v2-m3 weights persist across restarts
