# docker-compose.yml — QTKĐ RAG full stack
#
# ── Khởi động lần đầu ──────────────────────────────────────────────────────
#   make up            → build images + start tất cả services (~10-20 phút, tải models)
#   make pull-model    → tải LLM qwen2.5:7b-instruct vào Ollama (~4.7GB)
#   make index         → index build/spike_a/ vào Qdrant (chạy 1 lần)
#
# ── Sử dụng hằng ngày ──────────────────────────────────────────────────────
#   make start         → start (không rebuild)
#   make down          → dừng tất cả
#   make logs          → xem log realtime
#   make index         → re-index khi thêm tài liệu mới
#
# ── Ports ──────────────────────────────────────────────────────────────────
#   :3000  → React frontend  (http://localhost:3000)
#   :8080  → FastAPI backend (api.main, SSE)
#   :8010  → Embedding API   (BAAI/bge-m3)
#   :8011  → Reranker API    (BAAI/bge-reranker-v2-m3)
#   :6333  → Qdrant          (vector database)
#   :11434 → Ollama          (LLM: qwen2.5:7b-instruct)
#
# ── Lưu ý macOS ────────────────────────────────────────────────────────────
#   Docker trên Mac không dùng được Apple Silicon GPU.
#   Nếu muốn dùng GPU Metal: cài Ollama native (brew install ollama),
#   chạy `ollama serve`, rồi trong .env đặt:
#     OLLAMA_URL=http://host.docker.internal:11434/v1/chat/completions
#   Sau đó bỏ comment service `ollama` bên dưới.
#
# ── Lưu ý Linux + NVIDIA GPU ───────────────────────────────────────────────
#   Các service model hiện đã khai báo deploy.resources cho NVIDIA GPU.
#   Yêu cầu: nvidia-container-toolkit đã cài.

services:

  # ── PostgreSQL: Relational ledger. Port exposed to host so `api.main`
  #    can run natively (dev-local mode via run.sh) instead of in Docker. ─────
  postgres:
    image: postgres:16-alpine
    container_name: qtkd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qtkd}
      POSTGRES_USER: ${POSTGRES_USER:-qtkd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtkd_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtkd_user}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Vector Database ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: qtkd-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage   # bind mount: xem qdrant_storage/README.md
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Embedding service: BAAI/bge-m3 (1024-dim) ──────────────────────────────
  embedding:
    build:
      context: docker/inference
      dockerfile: Dockerfile
      args:
        MODE: embedding
        EMBEDDING_MODEL: BAAI/bge-m3
    image: qtkd-embedding:local
    container_name: qtkd-embedding
    environment:
      MODE: embedding
      EMBEDDING_MODEL: BAAI/bge-m3
      PORT: "8010"
      # Model đã nằm sẵn trong image/volume. Không bật offline thì huggingface_hub
      # vẫn gọi huggingface.co kiểm tra metadata lúc load; mất mạng là startup
      # crash ("Cannot send a request, as the client has been closed") thay vì
      # dùng cache → container crash-loop. Hệ thống chạy offline nên khoá hẳn.
      HF_HUB_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      # Cache model bền vững qua các lần restart/recreate — tránh phải tải lại
      # từ huggingface.co mỗi lần container khởi động.
      - hf_cache_embedding:/root/.cache/huggingface
    ports:
      - "8010:8010"
    restart: unless-stopped
    # Nạp sau cùng (Ollama -> reranker -> embedding): lấy VRAM còn dư nếu đủ
    # (GPU_MIN_FREE_MB), không thì CPU. Trên GPU 8 GB phần dư chỉ đủ cho một model
    # fp16 nên embedding chạy CPU: mỗi câu hỏi chỉ nhúng một câu ngắn (~0,1 s).
    depends_on:
      reranker:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # ── Reranker service: BAAI/bge-reranker-v2-m3 ──────────────────────────────
  reranker:
    build:
      context: docker/inference
      dockerfile: Dockerfile
      args:
        MODE: reranker
        RERANKER_MODEL: BAAI/bge-reranker-v2-m3
    image: qtkd-reranker:local
    container_name: qtkd-reranker
    environment:
      MODE: reranker
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      # 512 cắt mất nội dung section dài trước khi cross-encoder kịp thấy
      # (đo được Q39/Q48 bị giáng hạng). retrieval đã tự cắt doc ≈1.5k ký tự
      # quanh child match nên 1024 là dư an toàn.
      RERANKER_MAX_LENGTH: "1024"
      PORT: "8011"
      HF_HUB_OFFLINE: "1"  # xem giải thích ở service embedding
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - hf_cache_reranker:/root/.cache/huggingface
    ports:
      - "8011:8011"
    restart: unless-stopped
    # Nạp ngay sau Ollama, trước embedding: chấm 60 ứng viên trên CPU mất ~54 s mỗi câu
    # hỏi, là bước chậm nhất nên được phần VRAM còn dư trước (server.py tự về CPU nếu thiếu).
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # ── LLM: Ollama (qwen2.5:7b-instruct) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qtkd-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      OLLAMA_HOST: "0.0.0.0"
      # Mặc định Ollama nạp model với ctx 4096 — NHỎ hơn num_ctx=8192 mà
      # llm/generator.py yêu cầu; endpoint /v1 (OpenAI-compat) lại BỎ QUA trường
      # "options" nên prompt dài bị cắt từ ĐẦU (mất system prompt + nguồn [1][2]).
      # llm/generator.py nay gọi /api/chat (options được tôn trọng); env này là
      # lưới an toàn cho mọi client /v1 khác.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Giữ model trên GPU mãi mãi (llm.chat.keep_alive cũng là -1): Ollama mà nhả rồi
      # nạp lại sau khi embedding đã chiếm VRAM thì chỉ còn chỗ cho một phần layer -> chạy CPU.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Model healthcheck nạp trước; cùng giá trị với models.llm_chat của config/settings.yaml.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    restart: unless-stopped
    # Healthy = model chat đã nạp lên GPU. Lần đầu healthcheck tự nạp model khi VRAM còn
    # trống (embedding chờ healthy mới khởi động), nên qwen2.5:7b (~5 GB, ctx 8192) chạy 100% GPU.
    healthcheck:
      test: ["CMD-SHELL", "ollama ps | grep -q \"$$OLLAMA_MODEL\" || ollama run \"$$OLLAMA_MODEL\" '' </dev/null >/dev/null 2>&1"]
      interval: 30s
      timeout: 300s
      retries: 5
      start_period: 600s
    # ── NVIDIA GPU: bỏ comment để dùng RTX 5060 ──────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── FastAPI Backend cho React frontend ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qtkd-app:local
    container_name: qtkd-api
    # Chạy bằng UID/GID của người dùng host (không phải root): tệp ghi vào TC_DL/,
    # build/spike_a/ và .formula-registry/ phải ghi lại được khi chạy API trên host
    # (run-dev.sh). Sổ công thức thuộc root từng làm xoá/tải lên tài liệu hỏng.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      # Writable (not :ro like the `app`/`indexer` services) — the upload
      # feature saves .docx here and writes extracted .md/assets/report here.
      - ./build/spike_a:/app/build/spike_a
      - ./TC_DL:/app/TC_DL
      # Nháp/duyệt công thức phải sống qua lần dựng lại container: sao lưu cùng TC_DL/.
      - ${FORMULA_REGISTRY_DIR:-./.formula-registry}:/app/.formula-registry
    environment:
      FORMULA_REGISTRY_DB: /app/.formula-registry/registry.sqlite3
      HOME: /tmp   # UID host không có thư mục nhà trong image
      EMBED_URL: http://embedding:8010/v1/embeddings
      RERANK_URL: http://reranker:8011/v1/rerank
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}   # rỗng: dùng models.llm_chat của config/settings.yaml
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-qtkd}
      POSTGRES_USER: ${POSTGRES_USER:-qtkd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtkd_password}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Rỗng: dev sinh khóa tạm mỗi tiến trình; APP_ENV=production thì bắt buộc đặt (>= 32 byte).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend (nginx serve + proxy /api → api:8080) ────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: qtkd-frontend:local
    container_name: qtkd-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── One-time Indexer (chạy: make index) ────────────────────────────────────
  indexer:
    image: qtkd-app:local   # reuse image built by `api` service
    container_name: qtkd-indexer
    volumes:
      - ./build/spike_a:/app/build/spike_a:ro
    environment:
      EMBED_URL: http://embedding:8010/v1/embeddings
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "vectorstore.index"]

volumes:
  postgres_storage:   # PostgreSQL data persists across restarts
  ollama_data:      # Downloaded LLM models persist across restarts
  hf_cache_embedding:  # BAAI/bge-m3 weights persist across restarts
  hf_cache_reranker:   # BAAI/bge-reranker-v2-m3 weights persist across restarts
