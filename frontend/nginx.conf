server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx mặc định giới hạn body 1MB → 413 khi upload .docx; dev (Vite proxy) không giới hạn nên không thấy lỗi
    client_max_body_size 50m;

    # Proxy API calls tới FastAPI backend
    # proxy_buffering off bắt buộc cho SSE streaming hoạt động đúng
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
