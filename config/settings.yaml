# Cấu hình DUY NHẤT của backend QTKĐ RAG (đọc bởi core/settings_loader.py).
#
# ${TÊN:-mặc_định}: dùng biến môi trường TÊN nếu đặt và khác rỗng, không thì mặc_định.
# ${TÊN}: bắt buộc đặt biến môi trường; thiếu là dừng ngay lúc khởi động.
# Bí mật chỉ tham chiếu qua biến môi trường, không ghi giá trị thật vào file này.
# Đường dẫn tương đối tính từ thư mục gốc repo.

app:
  env: ${APP_ENV:-development}            # development | production
  startup_checks: ${QTKD_STARTUP_CHECKS:-true}

paths:
  source_dir: ${QTKD_SOURCE_DIR:-TC_DL}                       # tài liệu QTKĐ gốc (chỉ đọc + tải lên)
  markdown_dir: ${QTKD_MARKDOWN_DIR:-build/spike_a}           # Markdown + assets + extraction_report.json
  formula_registry_db: ${FORMULA_REGISTRY_DB:-.formula-registry/registry.sqlite3}  # nháp/duyệt/tính công thức (SQLite)
  frontend_dist: ${QTKD_FRONTEND_DIST:-frontend/dist}         # bản build React do API phục vụ (bản native, không nginx)
  approval_copies_dir: ${QTKD_APPROVAL_DIR:-approval_copies}  # bản cứng đã phê duyệt (PDF/ảnh) chỉ để xem, KHÔNG vào chatbot
  registry_dir: ${QTKD_REGISTRY_DIR:-registry_sources}        # file danh mục 877 đã nạp vào sổ đăng ký, KHÔNG vào Qdrant

services:
  embedding_url: ${EMBED_URL:-http://localhost:8010/v1/embeddings}
  rerank_url: ${RERANK_URL:-http://localhost:8011/v1/rerank}
  qdrant_url: ${QDRANT_URL:-http://localhost:6333}
  qdrant_api_key: ${QDRANT_API_KEY:-}
  ollama_url: ${OLLAMA_URL:-http://localhost:11434/api/chat}   # native /api/chat, không dùng /v1

models:
  embedding:
    name: BAAI/bge-m3                     # phải khớp docker-compose service embedding
    vector_size: 1024                     # phải khớp chiều vector của collection
  reranker:
    name: BAAI/bge-reranker-v2-m3         # phải khớp docker-compose service reranker
    max_length: 1024
  llm_chat: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}

embedding:
  query_timeout_s: 120
  batch_size: 8                           # chunk mỗi request lúc index
  batch_timeout_s: 1800

vectorstore:
  collection: qtkd_rag
  upsert_batch: 64

chunking:
  synth_section_chars: 4000
  max_table_rows: 15
  table_group_rows: 8
  table_group_chars: 1500                 # trần ký tự mỗi nhóm dòng bảng (vừa cửa sổ reranker)

retrieval:
  top_k: 50                               # ứng viên mỗi nhánh dense / BM25
  top_n: 5                                # nguồn trả về sau rerank
  top_n_per_file: 6                       # câu so sánh ≥2 QTKĐ: nguồn MỖI file (tổng = số file × giá trị này, không dưới top_n)
  rerank_pool: 60                         # trần ứng viên vào cross-encoder sau RRF + lọc nhiễu
  rrf_k: 60
  rrf_weight_dense: 1.0                   # trọng số nhánh dense trong RRF; chỉ tỷ lệ dense/BM25 có tác dụng
  rrf_weight_bm25: 1.0                    # trọng số nhánh BM25 trong RRF
  locate_subsection: true                 # nguồn hiển thị kèm mục con đánh số (vd. 6.3.2) chứa đoạn khớp nhất trong section cha
  subsection_title_chars: 120             # tiêu đề mục con dài hơn mức này không coi là tiêu đề
  min_routed_candidates: 6                # ít hơn thì bỏ lọc theo file, tìm toàn kho
  coverage_per_file: 6                    # câu không nêu thiết bị: lấy N mục tốt nhất MỖI tài liệu (0 = tắt)
  coverage_pool_per_file: 8               # ứng viên RRF mỗi tài liệu vào cross-encoder ở chế độ trên
  coverage_max_sources: 32               # trần số nguồn ở chế độ trên (nguồn điểm thấp vẫn bị lọc tin cậy)

reranking:
  timeout_s: 60
  doc_cap_chars: 1400                     # service rerank cắt ở 512 token (~1500 ký tự): 1400 + breadcrumb vẫn lọt
  batch_size: 8                           # cặp tối đa mỗi lần gọi reranker (GPU dùng chung, lô lớn bị CUDA OOM); lỗi thì tự chia đôi lô
  batch_max_chars: 12000                  # tổng ký tự document tối đa mỗi lô
  max_doc_chars: 1500                     # cắt mỗi document trước khi gửi (service cắt ở 512 token)
  min_batch_pause_s: 0.0                  # nghỉ giữa các lô (giây)
  doc_back_chars: 200                     # ngữ cảnh lấy phía trước vị trí child trong section cha

llm:
  chat:
    timeout_s: ${OLLAMA_TIMEOUT:-300}     # tới token đầu tiên; CPU nguội cần >120s
    num_ctx: 8192                         # phải khớp OLLAMA_CONTEXT_LENGTH của container
    max_new_tokens: 1024
    temperature: 0.0
    keep_alive: "-1m"                     # giữ LLM trên GPU mãi; nạp lại sau khi embedding chiếm VRAM là tràn sang CPU
    history_turns: 3
  context:
    chars_per_token: 2.5                  # đo qwen2.5:7b 2026-10-05: ngữ cảnh QTKĐ 2,54 ký tự/token (LaTeX tốn token)
    prompt_reserve_tokens: 1200           # prompt hệ thống (~450 token) + câu hỏi + lịch sử; câu trả lời trừ riêng
    max_block_chars: 4000                 # trần mỗi nguồn trừ nguồn top; tổng ngữ cảnh vẫn ≤ total_context_chars
    min_block_chars: 600                  # chỗ giữ cho mỗi nguồn xếp dưới khi nguồn trên lấy ngân sách trước
    quote_anchors: 2                      # panel nguồn: trích N đoạn con khớp nhất của mục (ngữ cảnh LLM dùng mọi đoạn khớp)
    formula_line_slack: 400               # khối dài hơn ngân sách bị cắt theo dòng: được vượt tới N ký tự để không cắt giữa dòng công thức
    linearize_value_tables: true          # bảng tra giá trị không có cột TT (hàng tiêu đề + hàng nhãn con) -> dòng 'nhãn hàng = giá trị: nhãn cột = giá trị'
    long_table_rows: 12                   # bảng dài hơn số dòng này: chỉ giữ dòng tiêu đề + dòng khớp từ khóa câu hỏi (0 = tắt)
    linearize_tables: true                # bảng markdown có cột TT -> dòng 'Tên: nhãn cột = giá trị' (retrieval/table_linearize.py)
    source_abs_floor: 0.08
    source_rel_floor: 0.20
  rewrite:                                # câu tiếp theo mất chủ ngữ ("Còn độ ẩm thì sao?") -> viết lại độc lập trước khi truy hồi
    enabled: true
    max_history_turns: 2
    answer_chars: 300
    max_query_chars: 400
    num_predict: 120
    timeout_s: 30
  multi_document:                         # câu không chỉ định một QTKĐ (chung chung hoặc nêu ≥2 QTKĐ): trả lời chung TRƯỚC, chỉ hỏi RIÊNG tài liệu chưa được trích [n]
    enabled: true
    extractive_enabled: true
    evidence_per_document: 3
    evidence_candidates_per_source: 12
    evidence_max_candidates: 96
    evidence_min_score: 0.35
    evidence_relative_floor: 0.35
    evidence_table_chars: 1500              # bảng dài hơn: trích từng dòng kèm tiêu đề cột
    min_documents: 2                      # ít hơn thì trả lời một lượt như thường
    max_documents: 7                      # trần số tài liệu xét bổ sung
    max_followups: 2                      # trần số lượt hỏi riêng sau câu trả lời chung (giữ p95)
    max_followups_named: 4                # trần khi câu hỏi nêu rõ ≥ 2 QTKĐ
    min_followup_score: 0.30              # câu chung: chỉ hỏi tài liệu có nguồn rerank_score ≥ mức này
    time_budget_s: 6.0                    # quá ngần này giây từ lúc bắt đầu sinh thì bỏ các lượt hỏi riêng còn lại
    generic_device_words: [thiết, bộ, hệ, máy, dụng]  # từ đầu alias quá chung: không tính là câu nêu một loại thiết bị
    context_chars: 5000                   # trần ngữ cảnh mỗi lượt (chỉ nguồn của tài liệu đó)
    num_predict: 90                       # trần token mỗi lượt hỏi riêng
    merge_identical: true                 # tài liệu cùng bộ số liệu gộp một dòng
    merge_max_chars: 80                   # giá trị dùng ở dòng gộp dài hơn mức này thì không gộp
    grounding_min_coverage: 0.6           # trích dẫn thay cho sinh: tỷ lệ từ khóa của câu hỏi có trong đoạn trích/tiêu đề, thấp hơn thì không dùng đường trích
    grounding_min_coverage_refusal: 0.8   # trích dẫn thay cho câu từ chối của model: chặt hơn, không đạt thì giữ câu từ chối
    grounding_absent_term_coverage: 0.9   # câu hỏi có từ khóa không xuất hiện ở bất kỳ nguồn truy hồi nào: cần phủ ≥ mức này mới được trích
    grounding_stop_words: [gồm, là, có, cần, phải, như, bao, nhiêu, nào, gì, được, trong, theo, thì, khi, ở, tại, bằng, với, mà, và, hay, hoặc, ra, sao, thế, để, bởi, do, nếu, lâu, một, lần, các, những, của, cho, này, đó, ấy, nêu, trên, lại, bất, mỗi, từng, mọi, tất, cả, thiết, bị, đo, phương, tiện, dụng, cụ, máy, loại, kiểm, định, kỳ, ban, đầu, sau, sửa, chữa, muốn, thực, hiện, tối, đa, mấy, cách, xác, nghĩa, như, thế, nào, bao, nhiêu, cũng, đã, sẽ, đang, về, từ, đến, hơn, ít, nhất, những, ai, đâu]
  number_check:                           # số liệu (a ± b, số kèm đơn vị) trong câu trả lời phải có trong nguồn
    enabled: true
    max_regen: 1                          # số lần sinh lại khi có số không có trong nguồn
  citation:                               # khối "Nguồn:" tất định: tên văn bản + mục sâu nhất + trang, bỏ [n] không tồn tại
    enabled: true
    min_keyword_len: 5                    # từ khóa của câu trả lời (khi không có [n] nào) dài tối thiểu N ký tự
    min_keyword_hits: 2                   # số từ khóa tối thiểu trùng với nguồn khi câu trả lời không có số
    max_auto_sources: 1                   # số nguồn tự gắn khi câu trả lời thiếu [n]

calc:                                     # tính trong chat bằng công thức đã duyệt (formula_registry); không có công thức duyệt thì như cũ
  enabled: true
  intent_pattern: '\b(tính|quy đổi|đổi sang|xác định|hiệu chỉnh|chuyển đổi)\b'
  max_formulas: 3
  min_variable_coverage: 0.6              # tỷ lệ từ nhãn biến phải có trong câu hỏi để chọn công thức
  num_predict: 300
  timeout_s: 60
  convert_enabled: true                   # "<số> <đv> sang <đv>" thuần túy: trả lời tất định bằng bảng UNITS, không qua LLM
  convert_verbs: 'quy đổi|chuyển đổi|đổi|chuyển'

object_scope:                             # hỏi quy trình/điều kiện kiểm định của đối tượng không có trong tiêu đề/phạm vi áp dụng các QTKĐ -> từ chối
  enabled: true
  trigger_pattern: 'quy trình|trình tự|phép kiểm định|điều kiện|chu kỳ|phương pháp|yêu cầu|nội dung|thời hạn'
  scope_section_pattern: 'phạm vi áp dụng'
  generic_words: [thiết, bị, đo, phương, tiện, dụng, cụ, máy, loại, các, những, một]
  ignore_words: [này, đó, ấy, nêu, trên, lại, định, kỳ, ban, đầu, sau, sửa, chữa, bất, kỳ, mỗi, từng, mọi, tất, cả, được, bằng, theo, tại, của, cho, với, trong, ở]
  stop_words: [gồm, là, có, cần, phải, như, bao, nào, gì, được, trong, theo, thì, khi, ở, tại, bằng, với, mà, và, hay, hoặc, ra, sao, thế, để, bởi, do, nếu, khác, giống, so]  # khác/giống/so: câu so sánh, không thuộc tên đối tượng

doc_profile:                              # "QTKĐ này để làm gì / nói về gì / gồm những mục nào": trả lời từ hồ sơ tài liệu, trích nguyên văn, không qua LLM
  enabled: true
  max_scope_chars: 1500                   # trích mục "Phạm vi áp dụng" tối đa bấy nhiêu ký tự
  max_documents: 3                        # câu hỏi khớp nhiều hơn số tài liệu này thì để pipeline RAG trả lời
  # Mẫu so trên câu hỏi đã bỏ dấu, chữ thường.
  purpose_pattern: '\b(?:de lam gi|dung de|dung cho|dung lam gi|ap dung cho|ap dung doi voi|pham vi ap dung|pham vi su dung|muc dich|kiem dinh (?:(?:loai|thiet bi|phuong tien|dung cu|binh|ap ke)(?: \w+){0,3} )?(?:gi|nao)|theo quy trinh nao)\b'
  overview_pattern: '\b(?:noi ve (?:\w+ ){0,2}(?:gi|nao)|noi dung (?:chinh )?(?:la )?gi|tom tat|gioi thieu|la tai lieu gi|la (?:quy trinh|tieu chuan|van ban)(?: kiem dinh)? gi|quy dinh (?:noi dung )?gi|de cap (?:den )?(?:noi dung )?gi)\b'
  toc_pattern: '\b(?:muc luc|gom (?:nhung|cac) (?:muc|phan|chuong|noi dung) nao|co (?:nhung|cac) (?:muc|phan|chuong) nao|bao gom (?:nhung|cac) (?:muc|phan|chuong)|cau truc)\b'
  # Câu hỏi về chi tiết khác (chu kỳ, sai số, điều kiện...) đi pipeline RAG dù có từ khoá ý định.
  exclude_pattern: '\b(?:chu ky|sai so|cong thuc|dieu kien|phuong tien kiem dinh|chuan bi|trinh tu|cac buoc|cach tinh|cach kiem|cach xac dinh|tinh toan|yeu cau|gioi han|bao lau|so sanh|khac nhau|khac gi|giong|ai|co quan|bien soan|ban hanh|thoi han|diem kiem tra|phep kiem dinh|liet ke|bang \d)\b'

faq:                                      # bộ câu hỏi - đáp án nạp sẵn: câu hỏi khớp một câu trong bộ thì trả đúng đáp án đó, trước mọi nhánh khác
  enabled: true                           # false = tắt hẳn, không trả lời theo bộ nào nữa
  # Bộ có sẵn trong mã nguồn (không upload: không hiện ở tab Tài liệu, không bị RAG truy xuất).
  # Markdown trích từ .docx cùng tên bằng `python -m ingestion.spike_a`; bỏ một dòng = không dùng bộ đó.
  files:
    - config/faq/100_cau_hoi_va_dap_an.md
  min_score: 0.8                          # điểm cross-encoder (câu hỏi người dùng ↔ câu hỏi trong bộ) tối thiểu; thấp hơn thì RAG trả lời
  max_candidates: 30                      # số câu (lọc thô theo từ chung) đưa vào cross-encoder
  show_sources: false                     # TẠM TẮT trích dẫn nguồn ([1], "Nguồn:") của câu trả lời từ bộ; true để bật lại
  answer_delay_s: 10                    # chờ trước khi trả lời (như đang tra cứu), giây
  stream_chunk_words: 1                   # số từ mỗi lần hiện chữ (số nguyên ≥ 1)
  stream_interval_s: 0.12                 # khoảng nghỉ giữa hai lần hiện chữ, giây
  question_header_pattern: '\bcau hoi\b'  # tiêu đề cột câu hỏi (đã bỏ dấu)
  answer_header_pattern: '\bdap an\b'     # tiêu đề cột đáp án (đã bỏ dấu)

doc_sections:                             # câu hỏi về một mục cấu trúc của tài liệu chỉ đích danh: trả lời nguyên văn mục đó, không qua LLM
  enabled: true
  max_documents: 3                        # câu khớp nhiều tài liệu hơn thì để pipeline RAG trả lời
  max_section_chars: 8000                 # mục dài hơn thì để pipeline RAG trích phần liên quan
  # Mẫu so trên câu hỏi đã bỏ dấu, chữ thường.
  equipment_pattern: '\b(?:phuong tien (?:kiem dinh|chuan|do chuan)|thiet bi chuan|chuan (?:duoc )?(?:dung|su dung|can dung) (?:de|khi|cho) kiem dinh|(?:can|dung|su dung) (?:nhung |cac )?(?:phuong tien|thiet bi chuan) (?:gi|nao))\b'
  conditions_pattern: '\b(?:dieu kien (?:kiem dinh|moi truong)|chuan bi (?:gi|nhung gi|truoc khi|kiem dinh)|can chuan bi)\b'
  cycle_pattern: '\bchu ky\b(?! lam viec)'
  agency_pattern: '\b(?:co quan (?:bien soan|de nghi|trinh duyet|xet duyet|ban hanh|chu tri)|(?:ai|don vi nao) (?:bien soan|ban hanh|chu tri)|chu nhiem)\b'
  # Câu hỏi cần suy luận / tính toán đi pipeline RAG dù có từ khoá mục.
  exclude_pattern: '\b(?:tai sao|vi sao|cach tinh|tinh toan|cong thuc|co dat|dat khong)\b'
  # Câu so sánh nhiều tài liệu nêu đích danh: thêm khối phạm vi + điều kiện + chu kỳ nguyên văn vào ngữ cảnh LLM.
  comparison_pattern: '\b(?:so sanh|khac nhau|khac (?:gi|o|cho|diem)|diem khac|giong nhau)\b'
  max_fact_chars: 1500

doc_catalog:                              # "những QTKĐ nào liên quan đến X": tìm X trong tên + phạm vi áp dụng của mọi tài liệu đã nạp
  enabled: true
  question_pattern: '\b(?:(?:nhung|cac) (?:qtkd|quy trinh|tai lieu)(?: kiem dinh)?(?: nao)? (?:lien quan|ap dung|dung cho|ve)|(?:qtkd|quy trinh|tai lieu) nao (?:lien quan|ap dung|dung cho|ve|quy dinh))\b'
  topic_pattern: '\b(?:lien quan (?:den|toi)|ap dung cho|dung cho|quy dinh ve|ve)\s+(.+)$'
  topic_prefix_pattern: '^(?:cac |nhung )?(?:viec |thiet bi |phuong tien (?:do )?)?(?:do |co )?'
  max_documents: 10

limit_clarify:                            # "có đạt không" mà giới hạn tra bảng theo thông số chưa nêu: hỏi lại, không kết luận
  enabled: true
  question_pattern: '\b(?:co dat|dat khong|dat yeu cau|co phu hop|co duoc chap nhan|nam trong (?:gioi han|sai so cho phep))\b'
  limit_pattern: '\b(?:sai so cho phep|gioi han cho phep)\b'   # bảng / cột giới hạn
  max_tables: 8

query_synonyms:                           # từ người dùng hay dùng nhưng tài liệu gọi khác: thêm tên trong tài liệu vào câu hỏi
  - {term: "độ kín", adds: "độ tụt áp"}

doc_scopes:                               # loại câu hỏi -> chỉ tìm trong nhóm tài liệu của loại đó (câu không nêu số QTKĐ / mã TCVN)
  enabled: true
  fallback_min_score: 0.1                 # nguồn tốt nhất trong nhóm dưới mức này thì tìm lại toàn kho (nhóm là ưu tiên, không phải rào cứng)
  # Câu liệt kê cả nhóm ("những thiết bị chuẩn mẫu nào có trong kho") trả lời tất định từ hồ sơ tài liệu, không qua LLM.
  # Câu có điều kiện lọc (số, phạm vi, cấp chính xác, "đo được ...") khớp list_exclude_pattern thì để RAG chọn tài liệu.
  list_pattern: '\b(?:liet ke|danh sach|co bao nhieu|gom (?:nhung|cac)|(?:nhung|cac) (?:\w+ ){1,6}nao (?:co |hien co |dang co |duoc )?(?:trong|o) (?:kho|he thong|co so du lieu)|(?:nhung|cac) (?:\w+ ){1,6}nao(?: dang)? (?:co|hien co|duoc luu)$)\b'
  list_exclude_pattern: '\d|\b(?:do duoc|dung (?:cho|de)|pham vi|dai do|cap chinh xac|sai so|khong dam bao|tuyet doi|chan khong|thuy luc|khi nen|ap suat (?:khi|du|am)|lon nhat|nho nhat|cao nhat|thap nhat)\b'
  # Mẫu so trên câu hỏi / tên tài liệu / tên mục đã bỏ dấu, chữ thường. Tài liệu vào nhóm khi khớp một bộ chọn:
  # stem_pattern (tên tệp), title_pattern (tên tài liệu trong hồ sơ), section_pattern (tên mục cấp 1-2).
  # priority: loại này thắng cả tên thiết bị router nhận ra ngoài nhóm; nhiều loại thường khớp thì hợp nhóm.
  scopes:
    - name: thiet_bi_chuan_mau
      label: Thiết bị chuẩn mẫu (tài liệu kỹ thuật và hướng dẫn vận hành chuẩn đo lường)
      question_pattern: '\bthiet bi chuan mau\b'
      stem_pattern: '^A_'
      priority: true
    - name: huong_dan_van_hanh
      label: Hướng dẫn vận hành / sử dụng thiết bị chuẩn
      question_pattern: '\bhuong dan (?:van hanh|su dung)\b'
      stem_pattern: '^A_'
    - name: ap_suat
      label: Đo áp suất (áp kế, bàn tạo áp, bình phân ly, van an toàn, chân không)
      question_pattern: '\b(?:ap suat|ap ke|ap chan khong|chan khong ke|ban tao ap|binh phan ly|van an toan|pit ?tong|piston|khi tai lan)\b'
      title_pattern: '\b(?:ap suat|ap ke|ap chan khong|ban tao ap|binh phan ly|van an toan|khi tai lan)\b'
    - name: nhiet_do
      label: Đo nhiệt độ (nhiệt kế, cặp nhiệt điện, chỉ thị nhiệt độ, lò / bình ổn nhiệt, nhiệt ẩm)
      question_pattern: '\b(?:nhiet ke|cap nhiet|chi thi nhiet do|lo nhiet|binh on nhiet|thiet bi do nhiet do|do nhiet do - do am|nhiet am ke)\b'
      title_pattern: '\bnhiet\b'
    - name: dung_tich
      label: Đo dung tích (bình định mức, buret, pipet, ống đong, bình chuẩn)
      question_pattern: '\b(?:dung tich|binh dinh muc|buret|pipet|ong dong|binh chuan)\b'
      title_pattern: '\bdung tich\b'
    - name: luu_luong
      label: Đo lưu lượng, xăng dầu, tiêu hao nhiên liệu
      question_pattern: '\b(?:luu luong|xang dau|nhien lieu)\b'
      title_pattern: '\b(?:luu luong|xang dau|nhien lieu)\b'
    - name: toc_do_vong_quay
      label: Đo tốc độ vòng quay (takhomet)
      question_pattern: '\b(?:toc do vong quay|takhomet|tachometer|may do toc do)\b'
      title_pattern: '\b(?:takhomet|toc do vong quay)\b'
    - name: do_ph
      label: Đo pH
      question_pattern: '\b(?:do ph|ph ke|may do ph|gia tri ph|dung dich (?:chuan |dem )?ph)\b'
      title_pattern: '\bdo ph\b'
    - name: nang_luc_phong_thi_nghiem
      label: Năng lực phòng thử nghiệm / hiệu chuẩn (TCVN ISO/IEC 17025)
      question_pattern: '\b(?:phong thu nghiem|phong thi nghiem|phong hieu chuan|he thong quan ly|tinh khach quan|tinh bao mat|khieu nai|danh gia noi bo|xem xet cua lanh dao|cong viec khong phu hop)\b'
      title_pattern: '\bphong thu nghiem\b'
    - name: thuat_ngu
      label: Thuật ngữ, định nghĩa đo lường (TCVN 6165 và mục thuật ngữ của QTKĐ)
      question_pattern: '\b(?:thuat ngu|dinh nghia|khai niem|duoc hieu la|tu vung|giai thich tu ngu)\b'
      title_pattern: '\bthuat ngu\b'
      section_pattern: '\b(?:thuat ngu|giai thich tu ngu)\b'

doc_summary:                              # tóm tắt tài liệu do LLM viết lúc nạp, người duyệt phê duyệt rồi chat mới dùng
  enabled: true
  generate_on_ingest: true                # nạp xong tài liệu thì xếp hàng sinh nháp tóm tắt (luồng nền, một việc mỗi lúc)
  use_in_chat: true                       # câu "tóm tắt / nói về gì" dùng bản đã duyệt thay cho trích phạm vi
  max_input_chars: 14000                  # văn bản đưa LLM; cộng câu trả lời phải nằm trong llm.chat.num_ctx
  max_new_tokens: 700
  timeout_s: 600

ingestion:
  soffice_bin: ${SOFFICE_BIN:-}           # rỗng = tìm `soffice` trên PATH
  ruby_bin: ${RUBY_BIN:-}                 # rỗng = tìm `ruby` trên PATH (bản Windows mang Ruby riêng)
  convert_timeout_s: 120
  max_upload_bytes: 52428800              # 50 MiB
  marker_python: ${MARKER_PYTHON:-}
  marker_device: ${MARKER_DEVICE:-cpu}                  # cpu: chạy bằng CPU/RAM, không đụng GPU của Ollama; cuda: tạm dỡ LLM khỏi GPU khi xử lý PDF rồi nạp lại
  marker_pages_per_run: ${MARKER_PAGES_PER_RUN:-10}     # số trang tối đa mỗi lần gọi Marker: chặn đỉnh RAM khi PDF dài
  marker_memory_max_mb: ${MARKER_MEMORY_MAX_MB:-5120}   # trần RAM của tiến trình Marker (cgroup qua systemd-run); vượt thì chỉ Marker bị dừng, 0 = không giới hạn
  marker_threads: ${MARKER_THREADS:-4}                  # số luồng CPU torch/BLAS của Marker

database:
  url: ${DATABASE_URL:-}                  # đặt thì thắng mọi trường bên dưới
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  name: ${POSTGRES_DB:-qtkd}
  user: ${POSTGRES_USER:-qtkd_user}
  password: ${POSTGRES_PASSWORD:-qtkd_password}   # mặc định chỉ cho dev; production bị chặn

auth:
  enabled: ${AUTH_ENABLED:-true}    # true: bắt buộc đăng nhập mọi route (trừ health/login); false: mọi người dùng là quản trị viên cục bộ
  jwt_secret_key: ${JWT_SECRET_KEY:-}     # rỗng: dev sinh khóa tạm, production dừng
  jwt_algorithm: HS256
  jwt_expiration_hours: ${JWT_EXPIRATION_HOURS:-24}

api:
  host: ${API_HOST:-0.0.0.0}
  port: ${API_PORT:-8080}
  cors_origins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000
    - http://127.0.0.1:5173

# Sổ đăng ký danh mục 877 (docs/KIEN_TRUC_DANH_MUC_877.md). Mọi câu hỏi tra sổ đăng ký trước:
# câu hỏi chung trả lời tất định từ 4 file danh mục, câu hỏi sâu chỉ tìm trong tài liệu sổ đăng ký chỉ ra.
# Mẫu *_pattern so trên chữ đã bỏ dấu, chữ thường; followup_pattern so trên chữ CÓ dấu ("đó" ≠ "đo" ≠ "độ").
registry:
  enabled: true
  max_upload_mb: 20               # file danh mục tải lên lớn hơn thì từ chối
  cache_ttl_s: 60                 # đọc lại bản danh mục đã duyệt sau khoảng này
  min_match_chars: 5              # tên khớp ngắn hơn (bỏ dấu, bỏ khoảng trắng) thì bỏ qua
  min_coverage: 0.5               # phần đầu tên khớp / độ dài tên tối thiểu để ghim tài liệu ("cặp nhiệt điện" / "cặp nhiệt điện kỹ thuật")
  fuzzy_min_ratio: 0.9            # khớp gần đúng khi gõ sai chính tả
  max_list: 40                    # câu liệt kê dài hơn thì nêu số lượng + gợi ý thu hẹp
  fallback_min_score: 0.1         # tìm sâu trong tài liệu đã ghim mà nguồn tốt nhất dưới mức này: tìm toàn kho
  followup_max_words: 10          # câu hỏi tiếp ngắn không nêu đối tượng thì dùng tiêu điểm của lượt trước
  # Phần tên khớp chỉ gồm các từ này ("thiết bị đo") thì không tính là khớp tên.
  generic_words: [thiet, bi, phuong, tien, do, cac, loai, nhung, may, bo, he, thong, dung, cu, kieu, va]
  general_patterns:
    exists: '\b(?:co|duoc) (?:kiem dinh|hieu chuan|nang luc|lam)\b.*\bkhong\b|\bco nang luc\b|\bco (?:the )?(?:kiem dinh|hieu chuan) .*\bduoc khong\b'
    count: '\b(?:bao nhieu|may (?:loai|chuan|quy trinh|phuong tien|thiet bi))\b'
    list: '\b(?:liet ke|danh sach|gom (?:nhung|cac)|(?:nhung|cac) (?:\w+ ){0,8}nao|(?:chuan|phuong tien|thiet bi) (?:mau )?nao)\b'
    procedure: '\b(?:(?:quy trinh|qtkd|qthc|van ban) (?:nao|gi)|theo (?:quy trinh|qtkd|qthc) nao|ap dung (?:quy trinh|qtkd|qthc) nao)\b'
    range: '\b(?:dai do|dai tao|pham vi do|pham vi lam viec|cap chinh xac|ccx|do chinh xac|tham so do luong|dac tinh do luong)\b'
    interval: '\bchu ky\b'
  deep_pattern: '\b(?:cach|the nao|ra sao|nhu nao|dieu kien|cac buoc|trinh tu|cong thuc|sai so cho phep|xu ly ket qua|danh gia|yeu cau ky thuat|phuong tien kiem dinh|can (?:nhung )?(?:chuan|thiet bi|phuong tien) gi|dung (?:nhung )?(?:chuan|thiet bi) gi|su dung|thao tac|do kin|do tut ap|bien ban|de lam gi|noi ve gi|tom tat)\b'
  standard_pattern: '(?<!tieu )(?<!hieu )\bchuan(?: mau)?\b(?! (?:bi|muc|hoa|xac))'   # không bắt "tiêu chuẩn", "hiệu chuẩn"
  procedure_pattern: '\b(?:quy trinh|qtkd|qthc|dlvn|van ban)\b'
  followup_pattern: '\b(?:đó|này|kia|trên|nó|ấy)\b|\b(?:thứ|mục|cái)\s+(?:\d+|nhất|hai|ba|tư|bốn|năm|sáu|bảy|tám|chín|mười)\b|^\s*(?:còn|thế còn|vậy còn)\b'
  aliases:
    - name: ta kho met
      aliases: [toc do ke, may do toc do vong quay]
    - name: khi ap ke
      aliases: [baromet, barometer]
    - name: huyet ap ke
      aliases: [may do huyet ap]
    - name: nhiet am ke
      aliases: [am ke, may do nhiet do do am]
