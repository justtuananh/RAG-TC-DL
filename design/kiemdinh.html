document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"font-size:12.5px;color:#64748B;font-weight:600;\">Hiển thị:<\u002Fspan>\n          <div style=\"display:flex;gap:2px;background:#fff;border:1px solid #E2E8F0;border-radius:9px;padding:3px;\">\n            <sc-for list=\"{{ docsPage.sizeOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><button onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.n }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:9px;max-height:430px;overflow-y:auto;padding-right:4px;\">\n        <sc-if value=\"{{ docsPage.empty }}\"><div style=\"text-align:center;padding:48px 0;color:#94A3B8;font-size:14px;border:1px dashed #E2E8F0;border-radius:13px;background:#fff;\">Không tìm thấy tệp phù hợp.<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ docsPage.items }}\" as=\"d\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #E6EAE8;border-radius:13px;padding:13px 15px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n            <div style=\"{{ d.extStyle }}\"><span style=\"font-family:'Be Vietnam Pro',sans-serif;font-size:10.5px;font-weight:700;color:#fff;\">{{ d.ext }}<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\">\n              <sc-if value=\"{{ d.isRenaming }}\"><input value=\"{{ d.name }}\" onchange=\"{{ d.onRename }}\" onkeydown=\"{{ d.onRenameKey }}\" onblur=\"{{ d.onRenameCommit }}\" autofocus=\"{{ true }}\" style=\"width:100%;border:1px solid #16A34A;outline:none;border-radius:7px;padding:5px 8px;font-family:inherit;font-size:14px;font-weight:600;color:#0F172A;box-shadow:0 0 0 3px #DCFCE7;\"><\u002Fsc-if>\n              <sc-if value=\"{{ d.notRenaming }}\"><div style=\"font-weight:600;font-size:14px;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ d.name }}<\u002Fdiv><\u002Fsc-if>\n              <div style=\"font-size:11.5px;color:#94A3B8;margin-top:3px;\">{{ d.meta }}<\u002Fdiv>\n              <sc-if value=\"{{ d.isProcessing }}\"><div style=\"height:6px;background:#F1F5F9;border-radius:9999px;overflow:hidden;margin-top:7px;max-width:270px;\"><div style=\"{{ d.progStyle }}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"{{ d.statusStyle }}\">\n              <sc-if value=\"{{ d.isReady }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ d.isProcessing }}\"><span style=\"width:11px;height:11px;border:2px solid #FDE68A;border-top-color:#B45309;border-radius:50%;animation:spin .8s linear infinite;\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ d.isPending }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n              {{ d.statusLabel }}\n            <\u002Fspan>\n            <sc-if value=\"{{ d.isPending }}\"><button onclick=\"{{ d.onProcess }}\" title=\"Bắt đầu xử lý tài liệu\" style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border:none;border-radius:8px;background:#16A34A;color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;box-shadow:0 1px 3px rgba(22,163,74,.3);\" style-hover=\"background:#15803D;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"5 3 19 12 5 21 5 3\"><\u002Fpolygon><\u002Fsvg> Xử lý<\u002Fbutton><\u002Fsc-if>\n            <div style=\"display:flex;gap:2px;flex-shrink:0;\">\n              <button onclick=\"{{ d.onView }}\" title=\"Xem tài liệu\" style=\"width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94A3B8;\" style-hover=\"background:#F0FDF4;color:#16A34A;\">\n                <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fbutton>\n              <button onclick=\"{{ d.onStartRename }}\" title=\"Đổi tên\" style=\"width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94A3B8;\" style-hover=\"background:#F1F5F9;color:#334155;\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z\"><\u002Fpath><path d=\"m15 5 4 4\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <button onclick=\"{{ d.onDelete }}\" title=\"Xoá tài liệu\" style=\"width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94A3B8;\" style-hover=\"background:#FEF2F2;color:#DC2626;\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 6 5 6 21 6\"><\u002Fpolyline><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ docsPage.multiPage }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;flex-shrink:0;\">\n          <span style=\"font-size:12.5px;color:#64748B;\">Hiển thị {{ docsPage.showingFrom }}–{{ docsPage.showingTo }} / {{ docsPage.total }} tệp<\u002Fspan>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <button onclick=\"{{ docsPage.onPrev }}\" title=\"Trang trước\" style=\"{{ docsPage.prevStyle }}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n          <sc-for list=\"{{ docsPage.pages }}\" as=\"p\" hint-placeholder-count=\"3\"><button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.n }}<\u002Fbutton><\u002Fsc-for>\n          <button onclick=\"{{ docsPage.onNext }}\" title=\"Trang sau\" style=\"{{ docsPage.nextStyle }}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════ GUIDE TAB ══════ -->\n  <sc-if value=\"{{ tabGuide }}\">\n  <main style=\"flex:1;min-height:0;overflow-y:auto;background:#ECF1EE;\">\n    <div style=\"max-width:840px;margin:0 auto;padding:28px 24px 56px;\">\n\n      <div style=\"background:linear-gradient(135deg,#16A34A,#15803D);border-radius:16px;padding:26px 28px;color:#fff;box-shadow:0 10px 26px -12px rgba(22,163,74,.5);\">\n        <div style=\"font-size:22px;font-weight:700;margin-bottom:6px;\">Hướng dẫn sử dụng<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;opacity:.95;max-width:560px;\">Trợ lý giúp bạn tra cứu nhanh các quy trình kiểm định — không cần nhớ tài liệu nằm ở đâu, chỉ cần hỏi bằng tiếng Việt.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:16.5px;font-weight:700;color:#0F172A;margin:28px 0 13px;\">Bắt đầu trong 3 bước<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:13px;\">\n        <div style=\"background:#fff;border:1px solid #E6EAE8;border-radius:13px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:11px;\"><span style=\"width:28px;height:28px;border-radius:9999px;background:#16A34A;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;\">1<\u002Fspan><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:14.5px;color:#0F172A;margin-bottom:5px;\">Đặt câu hỏi<\u002Fdiv>\n          <div style=\"font-size:13px;color:#64748B;line-height:1.6;\">Gõ câu hỏi như đang hỏi đồng nghiệp, rồi nhấn Gửi. Không cần dùng từ khóa kỹ thuật.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E6EAE8;border-radius:13px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:11px;\"><span style=\"width:28px;height:28px;border-radius:9999px;background:#16A34A;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;\">2<\u002Fspan><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:14.5px;color:#0F172A;margin-bottom:5px;\">Đọc câu trả lời<\u002Fdiv>\n          <div style=\"font-size:13px;color:#64748B;line-height:1.6;\">Trợ lý tổng hợp từ tài liệu và trả lời ngắn gọn, kèm số trích dẫn [1], [2]…<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E6EAE8;border-radius:13px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:11px;\"><span style=\"width:28px;height:28px;border-radius:9999px;background:#16A34A;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;\">3<\u002Fspan><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><polyline points=\"9 12 11 14 15 10\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-weight:700;font-size:14.5px;color:#0F172A;margin-bottom:5px;\">Kiểm chứng nguồn<\u002Fdiv>\n          <div style=\"font-size:13px;color:#64748B;line-height:1.6;\">Bấm số [1] để mở tài liệu gốc và xem đúng đoạn được tô sáng. Luôn biết câu trả lời từ đâu.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:16.5px;font-weight:700;color:#0F172A;margin:28px 0 13px;\">Câu hỏi mẫu — bấm để hỏi ngay<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:9px;\">\n        <sc-for list=\"{{ sampleQs }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ q.onClick }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:#fff;border:1px solid #E2E8F0;border-radius:11px;font-family:inherit;font-size:13.5px;color:#334155;cursor:pointer;text-align:left;\" style-hover=\"border-color:#16A34A;background:#F0FDF4;color:#15803D;\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n            {{ q.text }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:16.5px;font-weight:700;color:#0F172A;margin:28px 0 13px;\">Cách đọc &amp; kiểm chứng nguồn<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;background:#fff;border:1px solid #E6EAE8;border-radius:15px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04);flex-wrap:wrap;\">\n        <div style=\"flex:1;min-width:250px;font-size:13.5px;color:#475569;line-height:1.7;\">\n          <p style=\"margin:0 0 10px;\">Mỗi con số màu xanh trong câu trả lời tương ứng với một đoạn trong tài liệu gốc.<\u002Fp>\n          <p style=\"margin:0;\">Khi bạn <strong style=\"color:#15803D;\">bấm vào số [1]<\u002Fstrong>, hệ thống sẽ mở đúng trang tài liệu và <strong style=\"color:#B45309;\">tô sáng đoạn được dùng để trả lời<\u002Fstrong>, kèm độ tin cậy — để bạn yên tâm kiểm chứng.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:250px;background:#F6F8F7;border:1px solid #E6EAE8;border-radius:12px;padding:15px;\">\n          <div style=\"font-size:13px;color:#1E293B;line-height:1.6;margin-bottom:6px;\">…phải đạt <strong>≥ 3 phút<\u002Fstrong> ở 20&nbsp;°C <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 5px;background:#DCFCE7;border:1px solid #86EFAC;color:#15803D;border-radius:6px;font-size:11.5px;font-weight:700;vertical-align:-3px;\">[1]<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;margin:7px 0;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><polyline points=\"19 12 12 19 5 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n          <div style=\"position:relative;background:#FEF6DD;border-left:4px solid #F59E0B;border-radius:0 8px 8px 0;padding:11px 13px;font-family:'Lora',serif;font-size:13px;color:#1E293B;line-height:1.55;\">\n            <span style=\"position:absolute;top:-9px;right:11px;background:#F59E0B;color:#fff;font-family:'Be Vietnam Pro',sans-serif;font-size:9px;font-weight:700;padding:2px 8px;border-radius:9999px;\">Đoạn trả lời<\u002Fspan>\n            Thời gian quay tự do tối thiểu của pít tông áp kế chuẩn phải đạt ≥ 3 phút trong điều kiện chuẩn (20&nbsp;°C).\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:16.5px;font-weight:700;color:#0F172A;margin:28px 0 13px;\">Tải tài liệu mới lên<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E6EAE8;border-radius:15px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:15px;\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start;\"><span style=\"flex-shrink:0;width:25px;height:25px;border-radius:9999px;background:#DCFCE7;color:#15803D;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;\">1<\u002Fspan><div style=\"font-size:13.5px;color:#475569;line-height:1.6;padding-top:2px;\">Mở tab <strong style=\"color:#15803D;\">Tài liệu<\u002Fstrong>, kéo thả tệp PDF/Word vào khung tải lên hoặc bấm để chọn tệp.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start;\"><span style=\"flex-shrink:0;width:25px;height:25px;border-radius:9999px;background:#DCFCE7;color:#15803D;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;\">2<\u002Fspan><div style=\"font-size:13.5px;color:#475569;line-height:1.6;padding-top:2px;\">Bấm nút <strong style=\"color:#15803D;\">Xử lý<\u002Fstrong> trên =\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.SAMPLES = [\n      'Thời gian quay tự do tối thiểu của pít tông áp kế là bao lâu?',\n      'Công thức hiệu chỉnh nhiệt độ cho thời gian quay tự do?',\n      'Sai số cho phép của áp kế pít tông cấp 0,05 là bao nhiêu?',\n      'Điều kiện môi trường khi kiểm định áp kế là gì?'\n    ];\n    this.FAQS = [\n      {q:'Trợ lý lấy thông tin từ đâu?', a:'Mọi câu trả lời đều dựa trên các tài liệu quy trình đã được tải lên hệ thống. Mỗi câu trả lời đều kèm số trích dẫn [1], [2]… — bấm vào để xem đúng đoạn trong tài liệu gốc.'},\n      {q:'Làm sao biết câu trả lời có đáng tin không?', a:'Bấm vào số trích dẫn màu xanh trong câu trả lời. Hệ thống sẽ mở tài liệu gốc và tô sáng đúng đoạn được dùng để trả lời, kèm mức “độ tin cậy” của đoạn đó.'},\n      {q:'Tôi tải tài liệu mới lên bằng cách nào?', a:'Vào tab Tài liệu, kéo thả tệp PDF hoặc Word vào khung tải lên, hoặc bấm để chọn tệp. Hệ thống xử lý trong giây lát; khi trạng thái chuyển “Đã sẵn sàng”, bạn có thể hỏi về tài liệu đó.'},\n      {q:'Cuộc trò chuyện có được lưu lại không?', a:'Có. Mọi cuộc trò chuyện được lưu ở thanh Lịch sử bên trái. Bạn có thể tìm kiếm, đổi tên hoặc ghim các hội thoại quan trọng để mở lại nhanh. Bấm nút thu gọn để ẩn hoặc hiện thanh này.'},\n      {q:'Tôi nên đặt câu hỏi thế nào cho hiệu quả?', a:'Hỏi ngắn gọn, đúng trọng tâm như đang hỏi một đồng nghiệp. Ví dụ: “Thời gian quay tự do tối thiểu là bao nhiêu?”. Nếu chưa rõ, cứ hỏi tiếp — trợ lý sẽ hỏi lại cho rõ.'}\n    ];\n    this.sources = [\n      { id:'1', code:'QTKĐ 1.061', file:'QTKĐ 1.061:2019 — Áp kế pít tông.pdf', path:'QTKĐ 1.061  ›  Mục 5  ›  5.3 Kiểm tra thời gian quay tự do', page:3, pages:12, rel:0.92, blocks:[\n        {h:'5   KIỂM TRA KỸ THUẬT'},\n        {sub:'5.3   Kiểm tra thời gian quay tự do của pít tông'},\n        {p:'Đặt pít tông ở vị trí cân bằng trong xi lanh. Truyền cho pít tông một chuyển động quay nhẹ quanh trục thẳng đứng rồi thả tự do. Dùng đồng hồ bấm giây đo khoảng thời gian từ lúc thả đến khi pít tông dừng hẳn.'},\n        {p:'Thời gian quay tự do tối thiểu của pít tông áp kế chuẩn phải đạt ≥ 3 phút trong điều kiện chuẩn (nhiệt độ 20 °C). Nếu thời gian nhỏ hơn 3 phút, pít tông không đạt yêu cầu và phải được làm sạch, bôi trơn lại trước khi kiểm định tiếp.', highlight:true},\n        {p:'Khi nhiệt độ môi trường khác 20 °C, thời gian đo được hiệu chỉnh về điều kiện chuẩn theo công thức nêu tại QTKĐ 1.063, Mục 4.2.'},\n        {note:'Ghi kết quả kiểm tra vào biên bản kiểm định theo Mẫu BB-01 kèm theo quy trình này.'}\n      ]},\n      { id:'2', code:'QTKĐ 1.063', file:'QTKĐ 1.063:2019 — Điều kiện môi trường.pdf', path:'QTKĐ 1.063  ›  Mục 4  ›  4.2 Hiệu chỉnh theo nhiệt độ', page:2, pages:8, rel:0.78, blocks:[\n        {h:'4   ĐIỀU KIỆN MÔI TRƯỜNG & HIỆU CHỈNH'},\n        {sub:'4.2   Hiệu chỉnh thời gian theo nhiệt độ'},\n        {p:'Phép đo thời gian quay tự do được thực hiện ở nhiệt độ môi trường ổn định. Khi nhiệt độ khác điều kiện chuẩn 20 °C, kết quả phải được quy đổi để bảo đảm tính so sánh giữa các lần kiểm định.'},\n        {p:'Thời gian quay tự do hiệu chỉnh về điều kiện chuẩn được xác định theo công thức:', highlight:true, formula:'t₀ = t · [ 1 + β · (θ − 20) ]'},\n        {p:'trong đó t là thời gian đo thực tế (giây), θ là nhiệt độ môi trường (°C) và β là hệ số giãn nở của dầu kiểm định. Với dầu kiểm định tiêu chuẩn, lấy β = 7,0 × 10⁻⁴ /°C (tra Bảng 2).'}\n      ]},\n      { id:'3', code:'QTKĐ 1.071', file:'QTKĐ 1.071:2020 — Sai số cho phép.pdf', path:'QTKĐ 1.071  ›  Phụ lục A  ›  Bảng A.1 Sai số cho phép', page:9, pages:15, rel:0.46, blocks:[\n        {h:'PHỤ LỤC A   SAI SỐ CHO PHÉP'},\n        {sub:'Bảng A.1   Sai số cho phép theo cấp chính xác'},\n        {table:{head:['Cấp chính xác','Sai số cho phép','Phạm vi áp dụng'], rows:[\n          ['0,02','± 0,02 %','Áp kế chuẩn đầu'],\n          ['0,05','± 0,05 %','Áp Click:(e)=>{ if(e&&e.stopPropagation)e.stopPropagation(); },\n      onRename:(e)=>self.renameConv(e,c.id),\n      onRenameKey:(e)=>{ if(e.key==='Enter'){e.preventDefault(); self.commitRenameConv();} },\n      onRenameCommit:()=>self.commitRenameConv(),\n      onPin:(e)=>self.togglePin(e,c.id), pinTitle:c.pinned?'Bỏ ghim':'Ghim hội thoại', pinColor:c.pinned?'#F59E0B':'#A8B2AC',\n      onStartRename:(e)=>self.startRenameConv(e,c.id),\n      onDelete:(e)=>self.requestDeleteConv(e,c.id)\n    };};\n    return groupsDef.map(g=>({key:g.key,label:g.label,isPinned:g.isPinned,items:list.filter(g.test).map(mk)})).filter(g=>g.items.length>0);\n  }\n  buildRailConvs(){\n    const self=this;\n    return this.state.conversations.slice(0,6).map(c=>{\n      const active=self.state.activeConvId===c.id;\n      return {key:c.id, title:c.title, onOpen:()=>self.openConv(c),\n        railStyle:'width:36px;height:36px;border-radius:9px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:'+(active?'#15803D':'#64748B')+';background:'+(active?'#DCFCE7':'transparent')+';' };\n    });\n  }\n  extColor(ext){ return ext==='PDF'?'#DC2626':ext==='DOCX'?'#2563EB':ext==='XLSX'?'#15803D':'#64748B'; }\n  mapDoc(d){\n    const self=this;\n    const renaming=self.state.renamingDoc===d.id;\n    const isReady=d.status==='ready', isProcessing=d.status==='processing', isPending=d.status==='pending', isError=d.status==='error';\n    const statusStyle='display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 11px;border-radius:9999px;font-size:12px;font-weight:600;'+\n      (isReady?'background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;':isProcessing?'background:#FFFBEB;color:#B45309;border:1px solid #FDE68A;':isPending?'background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0;':'background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;');\n    const statusLabel=isReady?'Đã sẵn sàng':isProcessing?('Đang xử lý '+(d.progress||0)+'%'):isPending?'Chưa xử lý':'Lỗi xử lý';\n    const meta=d.ext+'  ·  '+d.size+'  ·  '+(d.pages==='—'?'… trang':(d.pages+' trang'))+'  ·  '+d.date;\n    return {key:d.id, ext:d.ext,\n      extStyle:'flex-shrink:0;width:40px;height:48px;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;background:'+this.extColor(d.ext)+';',\n      isRenaming:renaming, notRenaming:!renaming, name:d.name, meta,\n      isReady, isProcessing, isPending, isError, statusStyle, statusLabel, onProcess:()=>self.processDoc(d.id),\n      progStyle:'height:100%;border-radius:9999px;background:#F59E0B;width:'+(d.progress||0)+'%;',\n      onRename:(e)=>self.renameDoc(e,d.id), onRenameKey:(e)=>{ if(e.key==='Enter'){e.preventDefault(); self.commitRenameDoc();} }, onRenameCommit:()=>self.commitRenameDoc(),\n      onStartRename:()=>self.startRenameDoc(d.id), onDelete:()=>self.deleteDoc(d.id), onView:()=>self.viewDoc(d) };\n  }\n  buildDocsPage(){\n    const q=this.state.docSearch.trim().toLowerCase();\n    const all=this.state.documents;\n    const filtered=q?all.filter(d=>d.name.toLowerCase().indexOf(q)>=0):all.slice();\n    const size=this.state.docPageSize, total=filtered.length;\n    const pageCount=Math.max(1, Math.ceil(total/size));\n    const page=Math.min(Math.max(1,this.state.docPage), pageCount);\n    const start=(page-1)*size;\n    const items=filtered.slice(start, start+size).map(d=>this.mapDoc(d));\n    const pages=[]; for(let i=1;i<=pageCount;i++){ const a=i===page; pages.push({key:i, n:i, onClick:()=>this.setState({docPage:i}),\n      style:'min-width:30px;height:30px;padding:0 8px;border-radius:7px;border:1px solid '+(a?'#16A34A':'#E2E8F0')+';background:'+(a?'#16A34A':'#fff')+';color:'+(a?'#fff':'#475569')+';font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;'}); }\n    const navBase='width:32px;height:32px;border-radius:7px;border:1px solid #E2E8F0;background:#fff;display:flex;align-items:center;justify-content:center;color:#475569;font-family:inherit;cursor:pointer;';\n    return { items, empty:total===0, total, showingFrom:total===0?0:start+1, showingTo:Math.min(start+size,total),\n      pages, multiPage:pageCount>1,\n      onPrev:()=>this.setState(s=>({docPage:Math.max(1,page-1)})), onNext:()=>this.setState(s=>({docPage:Math.min(pageCount,page+1)})),\n      prevStyle:navBase+(page>1?'':'opacity:.4;cursor:default;'), nextStyle:navBase+(page<pageCount?'':'opacity:.4;cursor:default;'),\n      sizeOptions:[5,10,100].map(n=>{ const a=n===size; return {key:n, n, onClick:()=>this.setState({docPageSize:n, docPage:1}),\n        style:'min-width:34px;height:28px;padding:0 9px;border:none;background:'+(a?'#16A34A':'transparent')+';color:'+(a?'#fff':'#64748B')+';border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;'}; }) };\n  }\n  genericBlocks(){\n    return [\n      {h:'1   PHẠM VI ÁP DỤNG'},\n      {p:'Tài liệu này quy định trình tự, thủ tục và yêu cầu kỹ thuật áp dụng cho công tác kiểm định, hiệu chuẩn phương tiện đo theo quy định hiện hành.'},\n      {h:'2   PHƯƠNG TIỆN & ĐIỀU KIỆN'},\n      {p:'Các chuẩn đo lường và phương tiện phụ trợ phải còn trong thời hạn hiệu lực của giấy chứng nhận kiểm định/hiệu chuẩn và phù hợp với phạm vi đo của phương tiện cần kiểm định.'},\n      {p:'Điều kiện môi trường tại nơi kiểm định phải ổn định: nhiệt độ (20 ± 5) °C, độ ẩm không vượt quá 80 % RH.'},\n      {h:'3   TIẾN HÀNH KIỂM ĐỊNH'},\n      {p:'3.1  Kiểm tra bên ngoài: phương tiện đo phải có nhãn mác, thang đo rõ ràng, không có hư hỏng ảnh hưởng đến đặc tính kỹ thuật đo lường.'},\n      {p:'3.2  Kiểm tra kỹ thuật: thực hiện theo trình tự nêu trong các bảng kiểm tra kèm theo và ghi nhận kết quả vào biên bản.'},\n      {p:'3.3  Kiểm tra đo lường: xác định sai số tại các điểm đo quy định và so sánh với sai số cho phép tương ứng.'},\n      {note:'Kết quả kiểm định được lập thành biên bản; phương tiện đạt yêu cầu được dán tem và cấp giấy chứng nhận kiểm định.'}\n    ];\n  }\n  docInfo(name){ const s=this.sources.find(x=> (name||'').indexOf(x.code)>=0); return s? {blocks:s.blocks, code:s.code, pages:s.pages} : {blocks:this.genericBlocks(), code:'TÀI LIỆU', pages:null}; }\n  viewDoc(d){\n    if(d.status && d.status!=='ready'){ this.showToast('Tài liệu đang được xử lý — vui lòng đợi'); return; }\n    const info=this.docInfo(d.name);\n    this.setState({viewingDoc:{name:d.name, code:info.code, pages:info.pages||(d.pages==='—'?null:d.pages), blocks:info.blocks}});\n  }\n  openSourceDoc(){ const s=this.sources.find(x=>x.id===this.state.activeCite)||this.sources[0]; this.setState({viewingDoc:{name:s.file, code:s.code, pages:s.pages, blocks:s.blocks}}); }\n  closeViewer(){ this.setState({viewingDoc:null}); }\n  openLlmConfig(){ this.setState({llmConfigOpen:true}); }\n  closeLlmConfig(){ this.setState({llmConfigOpen:false}); }\n  setLlm(field,val){ this.setState(s=>({llm:Object.assign({},s.llm,{[field]:val})})); }\n  testLlm(){\n    const l=this.state.llm;\n    if(!l.baseUrl.trim()||!l.apiKey.trim()||!l.model.trim()){ this.setState({llmTestResult:{ok:false,msg:'Vui lòng nhập đầy đủ Địa chỉ API, API Key và Tên mô hình trước khi kiểm tra.'}}); return; }\n    this.setState({llmTesting:true, llmTestResult:null, llmStatus:'checking'});\n    clearTimeout(this._llmT);\n    this._llmT=setTimeout(()=>{ this.setState({llmTesting:false, llmStatus:'active', llmTestResult:{ok:true, msg:'Kết nối thành công — mô hình đã phản hồi.', sample:'Xin chào! Tôi là trợ lý kiểm định, đã sẵn sàng hỗ trợ bạn.'}}); }, 1600);\n  }\n  buildLlmStatus(){\n    const s=this.state.llmStatus;\n    const m = s==='active'?{label:'Đang hoạt động',color:'#15803D',bg:'#F0FDF4',bd:'#BBF7D0',dot:'#22C55E',spin:false}\n      : s==='checking'?{label:'Đang kiểm tra…',color:'#B45309',bg:'#FFFBEB',bd:'#FDE68A',dot:'#F59E0B',spin:true}\n      : s==='error'?{label:'Mất kết nối',color:'#DC2626',bg:'#FEF2F2',bd:'#FECACA',dot:'#EF4444',spin:false}\n      : {label:'Chưa kết nối',color:'#64748B',bg:'#F1F5F9',bd:'#E2E8F0',dot:'#94A3B8',spin:false};\n    return {label:m.label, isSpin:m.spin, isDot:!m.spin,\n      style:'display:inline-flex;align-items:center;gap:7px;padding:7px 12px;background:'+m.bg+';border:1px solid '+m.bd+';border-radius:9999px;font-size:12.5px;font-weight:600;color:'+m.color+';cursor:pointer;font-family:inherit;',\n      dotStyle:'width:8px;height:8px;border-radius:9999px;flex-shrink:0;background:'+m.dot+';'+(s==='active'?'animation:pulseDot 2s ease-in-out infinite;':''),\n      spinStyle:'width:13px;height:13px;flex-shrink:0;border:2px solid '+m.bd+';border-top-color:'+m.color+';border-radius:50%;animation:spin .8s linear infinite;' };\n  }\n  buildViewer(){\n    const v=this.state.viewingDoc; if(!v) return null;\n    const blocks=(v.blocks||[]).map((b,bi)=>{\n      const o={key:bi, isH:false,isSub:false,isNote:false,isTable:false,isFormula:false,isPara:false};\n      if(b.h){o.isH=true;o.text=b.h;return o;}\n      if(b.sub){o.isSub=true;o.text=b.sub;return o;}\n      if(b.note){o.isNote=true;o.text=b.note;return o;}\n      if(b.table){o.isTable=true; o.head=b.table.head.map((h,i)=>({key:i,text:h})); o.rows=b.table.rows.map((r,ri)=>({key:ri, cells:r.map((c,ci)=>({key:ci,text:c}))})); return o;}\n      if(b.formula && !b.p){o.isFormula=true;o.text=b.formula;return o;}\n      o.isPara=true; o.text=b.p; o.hasFormula=!!b.formula; o.formula=b.formula||''; return o;\n    });\n    return {name:v.name, code:v.code, pageLabel: v.pages? ('TRANG 01 / '+String(v.pages).padStart(2,'0')) : 'TRANG 01', blocks, stop:(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); }};\n  }\n\n  renderVals(){\n    const st=this.state;\n    const hist=this.buildHistory();\n    const firstUser=st.messages.find(m=>m.role==='user');\n    return {\n      tabChat:st.tab==='chat', tabDocs:st.tab==='docs', tabGuide:st.tab==='guide',\n      chatColor:st.tab==='chat'?'#15803D':'#475569', docsColor:st.tab==='docs'?'#15803D':'#475569', guideColor:st.tab==='guide'?'#15803D':'#475569',\n      setChat:()=>this.go('chat'), setDocs:()=>this.go('docs'), setGuide:()=>this.go('guide'),\n      toast:st.toast,\n      confirmDelete:st.confirmDelete, confirmDeleteTitle:st.confirmDelete?st.confirmDelete.title:'', onConfirmDeleteYes:()=>this.confirmDeleteYes(), onConfirmDeleteNo:()=>this.confirmDeleteNo(), onModalStop:(e)=>{if(e&&e.stopPropagation)e.stopPropagation();},\n      sidebarOpen:st.sidebarOpen, sidebarClosed:!st.sidebarOpen, toggleSidebar:()=>this.toggleSidebar(),\n      chatRef:this.chatRef, onNewChat:()=>this.newChat(), chatTitle: firstUser? firstUser.text : 'Hội thoại mới',\n      messages:this.buildMessages(), messagesEmpty:st.messages.length===0,\n      isProc:!!st.proc, proc:this.buildProc(),\n      sampleQs:this.SAMPLES.map((q,i)=>({key:i, text:q, onClick:()=>this.askSample(q)})),\n      input:st.input, onInput:(e)=>this.setState({input:e.target.value}),\n      onKey:(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); this.send(); } },\n      onSend:()=>this.send(),\n      sendStyle:'flex-shrink:0;width:46px;height:46px;border:none;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.08);background:'+((st.input.trim()&&!st.proc)?'#16A34A':'#CBD5E1')+';',\n      sourceCount:this.sources.length, sources:this.buildSourceChips(), activeSource:this.buildActiveSource(), docRef:this.docRef, sourceW:st.sourceW, onResize:(e)=>this.startResize(e), showSource:st.messages.some(m=>m.role==='bot'),\n      onOpenOriginal:()=>this.openSourceDoc(),\n      histSearch:st.histSearch, onHistSearch:(e)=>this.setState({histSearch:e.target.value}),\n      historyGroups:hist, historyEmpty:hist.length===0, railConvs:this.buildRailConvs(),\n      onUpload:()=>this.uploadDemo(), docsPage:this.buildDocsPage(), docSearch:st.docSearch, onDocSearch:(e)=>this.setState({docSearch:e.target.value, docPage:1}), viewer:this.buildViewer(), onCloseViewer:()=>this.closeViewer(), docCount:this.state.documents.length+' tệp', readyCount:this.state.documents.filter(d=>d.status==='ready').length,\n      faqs:this.FAQS.map((f,i)=>({key:i, q:f.q, a:f.a, open:st.faqOpen===i, closed:st.faqOpen!==i, onClick:()=>this.toggleFaq(i)})),\n      openDocsTab:()=>this.go('docs'),\n      llmConfigOpen:st.llmConfigOpen, openLlmConfig:()=>this.openLlmConfig(), closeLlmConfig:()=>this.closeLlmConfig(),\n      llm:st.llm, onLlmBaseUrl:(e)=>this.setLlm('baseUrl',e.target.value), onLlmApiKey:(e)=>this.setLlm('apiKey',e.target.value), onLlmModel:(e)=>this.setLlm('model',e.target.value), onLlmTemp:(e)=>this.setLlm('temperature',e.target.value),\n      onTestLlm:()=>this.testLlm(), llmTesting:st.llmTesting, llmNotTesting:!st.llmTesting,\n      testOk:!!(st.llmTestResult&&st.llmTestResult.ok), testErr:!!(st.llmTestResult&&!st.llmTestResult.ok),\n      testMsg:st.llmTestResult?st.llmTestResult.msg:'', testSample:(st.llmTestResult&&st.llmTestResult.sample)||'', hasSample:!!(st.llmTestResult&&st.llmTestResult.sample),\n      llmStatusView:this.buildLlmStatus(), onSaveLlm:()=>{ this.closeLlmConfig(); this.showToast('Đã lưu cấu hình mô hình'); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
